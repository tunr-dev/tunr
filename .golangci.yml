version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.Writer).Write
        - (net/http.ResponseWriter).Write
        - (*compress/gzip.Writer).Write
        - io.Copy
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
        - (encoding/json.Encoder).Encode
        - (*encoding/json.Encoder).Encode
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - exitAfterDefer
    govet:
      disable:
        - fieldalignment
        - unusedwrite
        - shadow
    staticcheck:
      # v1 ran staticcheck (SA) + gosimple (S) but not stylecheck (ST) or
      # quickfix (QF); v2 folds all four into staticcheck. Keep v1's set.
      checks:
        - all
        - -ST*
        - -QF*
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
        path: _test\.go
      - linters:
          - noctx
        path: cmd/
      - linters:
          - errcheck
        path: sdk/
      - linters:
          - gosec
        text: G107|G110|G306|G404
      - linters:
          - staticcheck
        text: SA1012
      - linters:
          - prealloc
        text: Consider pre-allocating
    paths:
      - dist
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - dist
