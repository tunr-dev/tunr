# tunr self-hosted stack
# Usage:
#   docker compose up -d
#
# Requires:
#   - DNS wildcard: *.tunnel.yourdomain.com → your server IP
#   - Ports 80, 443 open
#
# To use with the CLI:
#   tunr share -p 3000 --relay https://tunnel.yourdomain.com

services:
  # ─── Caddy (TLS termination + wildcard certs) ────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
    environment:
      TUNR_DOMAIN: ${TUNR_DOMAIN:-tunnel.localhost}

  # ─── Relay Server ────────────────────────────────────────────
  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TUNR_DOMAIN: ${TUNR_DOMAIN:-tunnel.localhost}
      TUNR_JWT_SECRET: ${TUNR_JWT_SECRET:?set TUNR_JWT_SECRET in .env}
      DATABASE_URL: postgres://tunr:${POSTGRES_PASSWORD:-tunr}@postgres:5432/tunr?sslmode=disable
      # Agent Bridge — off unless set in .env (see .env.example).
      TUNR_BRIDGE_ENABLED: ${TUNR_BRIDGE_ENABLED:-}
      TUNR_GRANT_SIGNING_KEY: ${TUNR_GRANT_SIGNING_KEY:-}
      TUNR_BRIDGE_PUBLIC_URL: ${TUNR_BRIDGE_PUBLIC_URL:-}
      TUNR_BRIDGE_PORTAL_URL: ${TUNR_BRIDGE_PORTAL_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy

  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tunr}
      POSTGRES_DB: tunr
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Applied once, on a fresh volume. After upgrades re-run them by hand
      # (docs/SELF_HOSTING.md) — every file is re-runnable.
      - ./relay/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  pg_data:
