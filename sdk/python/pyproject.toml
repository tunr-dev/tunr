[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunr-sdk"
version = "0.9.0.post1"
description = "Official Python SDK for tunr — localhost tunneling made simple."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/tunr-dev/tunr"
Documentation = "https://tunr.sh/docs"

# The repo-root .gitignore has "/tunr" (the CLI binary); hatchling applies it
# relative to this directory and silently drops the tunr/ package, producing
# an empty wheel. Select files explicitly instead.
[tool.hatch.build]
ignore-vcs = true
exclude = ["__pycache__", "*.pyc", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["tunr"]

